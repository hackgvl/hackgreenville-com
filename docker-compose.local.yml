version: '3'
services:
  hackgreenville:
    build:
      context: .
      target: development
      args:
        USER_ID: '${USER_ID:-1000}'
        GROUP_ID: '${GROUP_ID:-1000}'
    image: hackgreenville
    container_name: hackgreenville
    ports:
      - '${APP_PORT:-80}:8080'
      - '${VITE_PORT:-5173}:5173' # vite development server
    env_file: [] # overriding this property from the base compose file
    volumes:
      - './:/var/www/html'
    restart: always
    depends_on:
    - hackgreenville-db
    - hackgreenville-redis
  hackgreenville-db:
    ports:
      - 3306:3306
    extends:
      file: docker-compose.yml
      service: hackgreenville-db
  hackgreenville-redis:
    extends:
      file: docker-compose.yml
      service: hackgreenville-redis
  hackgreenville-queue:
    extends:
      file: docker-compose.yml
      service: hackgreenville-queue
