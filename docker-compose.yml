# For more information: https://serversideup.net/open-source/docker-php/docs
version: '3'

services:
  hackgreenville:
    build:
      context: .
      target: development
      args:
        USER_ID: '${USER_ID:-1000}'
        GROUP_ID: '${GROUP_ID:-1000}'
    image: hackgreenville
    container_name: hackgreenville
    ports:
      - '${APP_PORT:-80}:8080'
      - '${VITE_PORT:-5173}:5173' # vite development server
    env_file:
      - .env
    volumes:
      - './:/var/www/html'
    restart: always
    depends_on:
    - hackgreenville-db
    - hackgreenville-redis

  # If you change this service name, remember to change the
  # DB_HOST environment variable to match!
  hackgreenville-db:
    image: 'mysql:8.0'
    container_name: hackgreenville-db
    expose:
      - 3306
    env_file:
      - .env
    restart: always
    volumes:
      - './mysql:/var/lib/mysql'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]

  hackgreenville-redis:
    image: 'redis:alpine'
    container_name: hackgreenville-redis
    ports:
        - '${FORWARD_REDIS_PORT:-6379}:6379'
    restart: always
    volumes:
        - './redis:/data'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  hackgreenville-queue:
    build:
      context: .
      target: development
      args:
        USER_ID: '${USER_ID:-1000}'
        GROUP_ID: '${GROUP_ID:-1000}'
    image: hackgreenville
    container_name: hackgreenville-queue
    env_file:
      - .env
    volumes:
      - './:/var/www/html'
    command: ['php', 'artisan', 'queue:work', '--queue=slack,default', '--timeout=120', '--tries=3']
    # The image's default healthcheck probes nginx/FPM, which this container doesn't run.
    healthcheck:
      test: ['CMD', 'healthcheck-queue']
      start_period: 10s
    stop_signal: SIGTERM
    restart: always
    depends_on:
      - hackgreenville-db
      - hackgreenville-redis
